{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-keycloak-config
  labels:
    {{- include "keycloak-config-cli.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-config
data:
  config.yaml: |
    realm: {{ .Values.config.realm | default "company" }}
    {{- if .Values.clients }}
    clients:
      {{- toYaml .Values.clients | nindent 6 }}
    {{- end }}
    {{- if .Values.roles }}
    roles:
      {{- toYaml .Values.roles | nindent 6 }}
    {{- end }}
    {{- if .Values.clientScopes }}
    clientScopes:
      {{- toYaml .Values.clientScopes | nindent 6 }}
    {{- end }}
{{- end }}