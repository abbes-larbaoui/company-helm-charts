{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-keycloak-config
  labels:
    {{- include "keycloak-config-cli.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-config
data:
{{- if .Values.config.files }}
  {{- range ,  := .Values.config.files }}
  {{  }}: |
{{  | indent 4 }}
  {{- end }}
{{- else }}
  {{- range ,  :=  .Files.Glob "keycloak/*.yaml" }}
  {{ base  }}: |
{{ $.Files.Get  | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}